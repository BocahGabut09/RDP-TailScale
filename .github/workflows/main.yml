name: RDP Telegram (Bore CLI)

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: "Pilih versi Windows"
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      username:
        description: "Username RDP"
        required: true
        default: RdpTpyo

permissions: {}

jobs:
  build-rdp:
    runs-on: ${{ inputs.os_choice || 'windows-2022' }}
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Aktifkan RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Buat user RDP
        shell: pwsh
        env:
          INPUT_USERNAME: ${{ inputs.username }}
        run: |
          $rdpUser = "$env:INPUT_USERNAME".Trim()
          if ([string]::IsNullOrWhiteSpace($rdpUser)) { $rdpUser = "RdpTpyo" }

          $rand = Get-Random -Minimum 100000 -Maximum 999999
          $password = "Pass123!" + "$rand"
          $securePassword = ConvertTo-SecureString -String("$password") -AsPlainText -Force

          if (Get-LocalUser -Name("$rdpUser") -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name("$rdpUser") -Force
          }

          New-LocalUser -Name("$rdpUser") -Password($securePassword) -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group("Remote Desktop Users") -Member("$rdpUser")
          Add-LocalGroupMember -Group("Administrators") -Member("$rdpUser")

          Write-Host("::add-mask::$password")

          Add-Content -Path($env:GITHUB_ENV) -Value("RDP_USERNAME=$rdpUser")
          Add-Content -Path($env:GITHUB_ENV) -Value("RDP_PASSWORD=$password")

      - name: Install & Hubungkan Bore Tunnel
        shell: pwsh
        run: |
          # Download Bore CLI
          $url = "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path -Path($env:TEMP) -ChildPath('bore.zip')
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TEMP -Force

          $exe = Join-Path -Path($env:TEMP) -ChildPath('bore.exe')
          $logOut = Join-Path -Path($env:TEMP) -ChildPath('bore_out.log')
          $logErr = Join-Path -Path($env:TEMP) -ChildPath('bore_err.log')

          # Jalankan tunnel ke bore.pub (StandardOutput dan StandardError dipisah agar tidak error)
          Start-Process -FilePath $exe -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput $logOut -RedirectStandardError $logErr

          $hostPort = $null
          for ($i = 1; $i -le 15; $i++) {
            Start-Sleep -Seconds 2
            $logs = ""
            if (Test-Path $logOut) { $logs += Get-Content $logOut -Raw }
            if (Test-Path $logErr) { $logs += Get-Content $logErr -Raw }

            if ($logs -match 'bore\.pub:(\d+)') {
              $port = $Matches[1]
              $hostPort = "bore.pub:$port"
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($hostPort)) {
            if (Test-Path $logOut) { Get-Content $logOut }
            if (Test-Path $logErr) { Get-Content $logErr }
            throw 'Gagal mendapatkan port dari Bore tunnel.'
          }

          Add-Content -Path($env:GITHUB_ENV) -Value("BORE_FULL=$hostPort")

      - name: Kirim akses ke Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FULL: ${{ env.BORE_FULL }}
          USERNAME: ${{ env.RDP_USERNAME }}
          PASSWORD: ${{ env.RDP_PASSWORD }}
          OS_NAME: ${{ inputs.os_choice || 'windows-2022' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) { throw 'Secret TELEGRAM_BOT_TOKEN belum dibuat.' }
          if ([string]::IsNullOrWhiteSpace($env:CHAT_ID)) { throw 'Secret TELEGRAM_CHAT_ID belum dibuat.' }

          $message = "<b>🖥 RDP WINDOWS (BORE) AKTIF</b>`n`n" +
                     "<b>OS:</b> $env:OS_NAME`n" +
                     "<b>PC Name / Host:</b> <code>$env:FULL</code>`n" +
                     "<b>Username:</b> <code>$env:USERNAME</code>`n" +
                     "<b>Password:</b> <code>$env:PASSWORD</code>`n`n" +
                     "💡 <i>Copas PC Name ke RD Client HP. (Jika mau pakai domain sendiri, buat CNAME <code>rdp</code> ke <code>bore.pub</code> lalu pakai format <code>rdp.domainmu.com:PORT</code>)</i>`n`n" +
                     "<b>🕹 Perintah Bot:</b>`n" +
                     "• <code>/status</code> - Cek status RDP`n" +
                     "• <code>/stop</code> - Matikan RDP"

          $body = @{
            chat_id = $env:CHAT_ID
            text = $message
            parse_mode = 'HTML'
          }

          $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body -TimeoutSec 30

      - name: Pertahankan RDP aktif & Bot Listener
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $offset = 0$startTime = Get-Date

          while ($true) {
            try {
              $updates = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/getUpdates?offset=$offset&timeout=5") -Method Get -TimeoutSec 10
              if ($updates.ok -and$updates.result.Count -gt 0) {
                foreach ($update in $updates.result) {$offset = $update.update_id + 1$chatId = "$($update.message.chat.id)"
                  $text = "$($update.message.text)".Trim()

                  if ($chatId -eq "$env:CHAT_ID") {
                    if ($text -eq "/status") {
                      $uptime = (Get-Date) -$startTime
                      $hours = [math]::Floor($uptime.TotalHours)
                      $mins =$uptime.Minutes
                      $reply = "🟢 <b>Status RDP:</b> Online (Bore)`n⏰ <b>Uptime:</b> ${hours} jam ${mins} menit"
                      $body = @{ chat_id = $chatId; text = $reply; parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                    }
                    elseif ($text -eq "/start" -or $text -eq "/menu") {
                      $reply = "🤖 <b>Bot Berjalan!</b>`n`n" +
                               "<b>Daftar Command:</b>`n" +
                               "• <code>/start</code> atau <code>/menu</code> - Untuk melihat menu`n" +
                               "• <code>/status</code> - Untuk melihat status RDP`n" +
                               "• <code>/stop</code> atau <code>/off</code> - Untuk mematikan server"
                      $body = @{ chat_id = $chatId; text =$reply; parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                    }
                    elseif ($text -eq "/stop" -or $text -eq "/off") {
                      $reply = "🛑 <b>RDP Berhasil Dimatikan!</b>"
                      $body = @{ chat_id = $chatId; text =$reply; parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                      exit 0
                    }
                  }
                }
              }
