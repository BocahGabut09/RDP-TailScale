name: RDP Telegram

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: "Pilih versi Windows"
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      username:
        description: "Username RDP"
        required: true
        default: RDP

permissions: {}

jobs:
  build-rdp:
    runs-on: ${{ inputs.os_choice || 'windows-2022' }}
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Aktifkan RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Buat user RDP
        shell: pwsh
        env:
          INPUT_USERNAME: ${{ inputs.username }}
        run: |
          $rdpUser = if ([string]::IsNullOrWhiteSpace($env:INPUT_USERNAME)) { "RDP" } else { $env:INPUT_USERNAME }

          if ($rdpUser -notmatch '^[a-zA-Z0-9_-]{3,20}$') {
            throw 'Username tidak valid.'
          }

          $password = "Pass123!" + (Get-Random -Minimum 100000 -Maximum 999999)
          $securePassword = ConvertTo-SecureString$password -AsPlainText -Force

          if (Get-LocalUser -Name $rdpUser -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $rdpUser
          }

          New-LocalUser -Name $rdpUser -Password$securePassword -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $rdpUser
          Add-LocalGroupMember -Group 'Administrators' -Member $rdpUser

          Write-Host "::add-mask::$password"

          "RDP_USERNAME=$rdpUser" \vert{} Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASSWORD=$password" \vert{} Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installer = Join-Path$env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $url -OutFile$installer
          Start-Process -FilePath 'msiexec.exe' -ArgumentList '/i', $installer, '/quiet', '/norestart' -Wait
          Remove-Item $installer -Force

      - name: Hubungkan Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Secret TAILSCALE_AUTH_KEY belum dibuat.'
          }

          $tailscale = Join-Path$env:ProgramFiles 'Tailscale\tailscale.exe'
          & $tailscale up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="rdp-$env:GITHUB_RUN_ID"

          $ip =$null
          for ($i = 1; $i -le 12; $i++) {
            $ip = (&$tailscale ip -4 | Select-Object -First 1).Trim()
            if ($ip -match '^\d{1,3}(\.\d{1,3}){3}$') {
              break
            }
            Start-Sleep -Seconds 5
          }

          if ($ip -notmatch '^\d{1,3}(\.\d{1,3}){3}$') {
            throw 'IP Tailscale tidak ditemukan.'
          }

          Write-Host "::add-mask::$ip"
          "TAILSCALE_IP=$ip" \vert{} Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cek koneksi RDP
        shell: pwsh
        run: |
          $result = Test-NetConnection -ComputerName$env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $result.TcpTestSucceeded) {
            throw 'Port RDP tidak dapat diakses.'
          }

      - name: Kirim akses ke Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IP: ${{ env.TAILSCALE_IP }}
          USERNAME: ${{ env.RDP_USERNAME }}
          PASSWORD: ${{ env.RDP_PASSWORD }}
          OS_NAME: ${{ inputs.os_choice || 'windows-2022' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) {
            throw 'Secret TELEGRAM_BOT_TOKEN belum dibuat.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CHAT_ID)) {
            throw 'Secret TELEGRAM_CHAT_ID belum dibuat.'
          }

          $message = "RDP AKTIF`n`nOS: $env:OS_NAME`nIP: $env:IP`nUsername: $env:USERNAME`nPassword: $env:PASSWORD`nPort: 3389"

          $body = @{
            chat_id = $env:CHAT_ID
            text = $message
          }

          Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage" -Method Post -Body $body -TimeoutSec 30 | Out-Null

      - name: Pertahankan RDP aktif
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 300
          }
          
