name: RDP Telegram (Ngrok)

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: "Pilih versi Windows"
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      username:
        description: "Username RDP"
        required: true
        default: RdpTpyo

permissions: {}

jobs:
  build-rdp:
    runs-on: ${{ inputs.os_choice || 'windows-2022' }}
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Aktifkan RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Buat user RDP
        shell: pwsh
        env:
          INPUT_USERNAME: ${{ inputs.username }}
        run: |
          $rdpUser = "$env:INPUT_USERNAME".Trim()
          if ([string]::IsNullOrWhiteSpace($rdpUser)) {$rdpUser = "RdpTpyo" }

          $rand = Get-Random -Minimum 100000 -Maximum 999999
          $password = "Pass123!" + "$rand"
          $securePassword = ConvertTo-SecureString -String("$password") -AsPlainText -Force

          if (Get-LocalUser -Name("$rdpUser") -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name("$rdpUser") -Force
          }

          New-LocalUser -Name("$rdpUser") -Password($securePassword) -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group("Remote Desktop Users") -Member("$rdpUser")
          Add-LocalGroupMember -Group("Administrators") -Member("$rdpUser")

          Write-Host("::add-mask::$password")

          Add-Content -Path($env:GITHUB_ENV) -Value("RDP_USERNAME=$rdpUser")
          Add-Content -Path($env:GITHUB_ENV) -Value("RDP_PASSWORD=$password")

      -       - name: Install & Hubungkan Ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            throw 'Secret NGROK_AUTH_TOKEN belum dibuat di GitHub Secrets!'
          }

          # Download & Extract Ngrok dari URL baru
          $url = 'https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip'
          $zip = Join-Path -Path($env:TEMP) -ChildPath('ngrok.zip')
          
          Invoke-WebRequest -Uri($url) -OutFile($zip)
          Expand-Archive -Path($zip) -DestinationPath($env:TEMP) -Force

          $ngrok = Join-Path -Path($env:TEMP) -ChildPath('ngrok.exe')
          & $ngrok config add-authtoken "$env:NGROK_AUTH_TOKEN"
          
          # Jalankan Ngrok dengan pembuatan log file
          $logFile = Join-Path -Path($env:TEMP) -ChildPath('ngrok.log')
          Start-Process -FilePath($ngrok) -ArgumentList("tcp 3389 --log=`"$logFile`"")

          $hostPort =$null
          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 3
            try {
              $tunnels = Invoke-RestMethod -Uri('http://127.0.0.1:4040/api/tunnels') -ErrorAction SilentlyContinue
              if ($tunnels -and $tunnels.tunnels -and$tunnels.tunnels.Count -gt 0) {
                $publicUrl =$tunnels.tunnels[0].public_url
                if ($publicUrl) {
                  $hostPort =$publicUrl -replace 'tcp://', ''
                  break
                }
              }
            } catch {}
          }

          # Jika masih gagal dapet URL, tampilkan log error Ngrok-nya
          if ([string]::IsNullOrWhiteSpace($hostPort)) {
            if (Test-Path $logFile) {
              Write-Host "=== LOG NGROK ERROR ==="
              Get-Content $logFile
            }
            throw 'Gagal mendapatkan URL Ngrok. Cek log error di atas.'
          }

          $parts =$hostPort.Split(':')
          $ngrokHost =$parts[0]
          $ngrokPort =$parts[1]

          Write-Host("::add-mask::$ngrokHost")
          Write-Host("::add-mask::$ngrokPort")
          Add-Content -Path($env:GITHUB_ENV) -Value("NGROK_HOST=$ngrokHost")
          Add-Content -Path($env:GITHUB_ENV) -Value("NGROK_PORT=$ngrokPort")
          Add-Content -Path($env:GITHUB_ENV) -Value("NGROK_FULL=$hostPort")

      - name: Kirim akses ke Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOST: ${{ env.NGROK_HOST }}
          PORT: ${{ env.NGROK_PORT }}
          FULL: ${{ env.NGROK_FULL }}
          USERNAME: ${{ env.RDP_USERNAME }}
          PASSWORD: ${{ env.RDP_PASSWORD }}
          OS_NAME: ${{ inputs.os_choice || 'windows-2022' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) {
            throw 'Secret TELEGRAM_BOT_TOKEN belum dibuat.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CHAT_ID)) {
            throw 'Secret TELEGRAM_CHAT_ID belum dibuat.'
          }

          $message = "<b>🖥 RDP WINDOWS (NGROK) AKTIF</b>`n`n" +
                     "<b>OS:</b> $env:OS_NAME`n" +
                     "<b>PC Name / Host:</b> <code>$env:FULL</code>`n" +
                     "<b>Username:</b> <code>$env:USERNAME</code>`n" +
                     "<b>Password:</b> <code>$env:PASSWORD</code>`n`n" +
                     "💡 <i>Langsung copas isi <b>PC Name</b> di RD Client HP dengan: <code>$env:FULL</code> (tanpa VPN lagi)</i>`n`n" +
                     "<b>🕹 Perintah Bot:</b>`n" +
                     "• <code>/status</code> - Cek status RDP`n" +
                     "• <code>/stop</code> - Matikan RDP"

          $body = @{
            chat_id = $env:CHAT_ID
            text = $message
            parse_mode = 'HTML'
          }

          $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body -TimeoutSec 30

      - name: Pertahankan RDP aktif & Bot Listener
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $offset = 0
          $startTime = Get-Date

          while ($true) {
            try {
              $updates = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/getUpdates?offset=$offset&timeout=5") -Method Get -TimeoutSec 10
              if ($updates.ok -and $updates.result.Count -gt 0) {
                foreach ($update in $updates.result) {
                  $offset = $update.update_id + 1
                  $chatId = "$($update.message.chat.id)"
                  $text = "$($update.message.text)".Trim()

                  if ($chatId -eq "$env:CHAT_ID") {
                    if ($text -eq "/status") {
                      $uptime = (Get-Date) - $startTime
                      $hours = [math]::Floor($uptime.TotalHours)
                      $mins = $uptime.Minutes
                      $reply = "🟢 <b>Status RDP:</b> Online (Ngrok)`n⏰ <b>Uptime:</b> ${hours} jam${mins} menit"
                      $body = @{ chat_id = $chatId; text =$reply; parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                    }
                    elseif ($text -eq "/start" or $text -eq "/menu") {
                      $reply = "<b>Bot Berjalan!'nDaftar Command:'n<b>/start or /menu <b>Untuk Melihat Menu<b>'n/status <b>Untuk Melihat Status<b>'n/stop or /off <b>Untuk Mematikan Server<b>"
                      $body =@{ chat_id = $chatid; text =$reply: parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                      }
                    elseif ($text -eq "/stop" -or $text -eq "/off") {
                      $reply = "🛑 <b>RDP Berhasil Dimatikan!</b>"
                      $body = @{ chat_id = $chatId; text =$reply; parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                      exit 0
                    }
                  }
                }
              }
            } catch {
              # Abaikan error sejenak
            }
            Start-Sleep -Seconds 3
          }
          
