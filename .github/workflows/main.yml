name: RDP Telegram (Playit.gg)

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: "Pilih versi Windows"
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      username:
        description: "Username RDP"
        required: true
        default: RdpTpyo

permissions: {}

jobs:
  build-rdp:
    runs-on: ${{ inputs.os_choice || 'windows-2022' }}
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Aktifkan RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Buat user RDP
        shell: pwsh
        env:
          INPUT_USERNAME: ${{ inputs.username }}
        run: |
          $rdpUser = "$env:INPUT_USERNAME".Trim()
          if ([string]::IsNullOrWhiteSpace($rdpUser)) { $rdpUser = "RdpTpyo" }

          $rand = Get-Random -Minimum 100000 -Maximum 999999
          $password = "Pass123!" + "$rand"
          $securePassword = ConvertTo-SecureString -String("$password") -AsPlainText -Force

          if (Get-LocalUser -Name("$rdpUser") -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name("$rdpUser") -Force
          }

          New-LocalUser -Name("$rdpUser") -Password($securePassword) -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group("Remote Desktop Users") -Member("$rdpUser")
          Add-LocalGroupMember -Group("Administrators") -Member("$rdpUser")

          Write-Host("::add-mask::$password")

          Add-Content -Path($env:GITHUB_ENV) -Value("RDP_USERNAME=$rdpUser")
          Add-Content -Path($env:GITHUB_ENV) -Value("RDP_PASSWORD=$password")

      - name: Install & Hubungkan Playit.gg
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          # Download Playit CLI
          $url = "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe"
          $exe = Join-Path -Path($env:TEMP) -ChildPath('playit.exe')
          Invoke-WebRequest -Uri $url -OutFile $exe

          $logFile = Join-Path -Path($env:TEMP) -ChildPath('playit.log')

          if ([string]::IsNullOrWhiteSpace($env:PLAYIT_SECRET)) {
            # Jika belum ada PLAYIT_SECRET, buat Claim Link
            Start-Process -FilePath $exe -RedirectStandardOutput $logFile -RedirectStandardError $logFile
            Start-Sleep -Seconds 6

            $logs = Get-Content $logFile -Raw
            if ($logs -match 'https://playit\.gg/claim/[a-zA-Z0-9-]+') {
              $claimUrl = $Matches[0]

              $msg = "🔗 <b>KLAIM PLAYIT AGENT</b>`n`n" +
                     "Klik link ini untuk menghubungkan RDP ke akun Playit:`n" +
                     "$claimUrl`n`n" +
                     "💡 <i>Setelah klaim, buat Secret Key di Playit lalu simpan di GitHub Secrets dengan nama <b>PLAYIT_SECRET</b> agar otomatis seterusnya!</i>"

              $body = @{ chat_id = $env:CHAT_ID; text =$msg; parse_mode = 'HTML' }
              $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
              throw 'Claim Link telah dikirim ke Telegram. Silakan klik link tersebut di Telegram.'
            }
          } else {
            # Jalankan dengan PLAYIT_SECRET yang tersimpan
            Start-Process -FilePath $exe -ArgumentList "run --secret $env:PLAYIT_SECRET" -RedirectStandardOutput $logFile -RedirectStandardError$logFile
            Start-Sleep -Seconds 10
          }

          # Ambil Info Tunnel dari API Playit
          $playitAddress = "Cek Tunnel di Dashboard Playit.gg"
          try {
            $bodyJson = @{ secret = $env:PLAYIT_SECRET } \vert{} ConvertTo-Json$res = Invoke-RestMethod -Uri "https://api.playit.gg/v1/proto/secret/info" -Method Post -Body $bodyJson -ContentType "application/json" -ErrorAction SilentlyContinue
            if ($res -and$res.data -and $res.data.tunnels -and$res.data.tunnels.Count -gt 0) {
              $t =$res.data.tunnels[0]
              $hostName =$t.display_address
              $portNum =$t.port
              $playitAddress = "$hostName`:$portNum"
            }
          } catch {}

          Add-Content -Path($env:GITHUB_ENV) -Value("PLAYIT_FULL=$playitAddress")

      - name: Kirim akses ke Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FULL: ${{ env.PLAYIT_FULL }}
          USERNAME: ${{ env.RDP_USERNAME }}
          PASSWORD: ${{ env.RDP_PASSWORD }}
          OS_NAME: ${{ inputs.os_choice || 'windows-2022' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) { throw 'Secret TELEGRAM_BOT_TOKEN belum dibuat.' }
          if ([string]::IsNullOrWhiteSpace($env:CHAT_ID)) { throw 'Secret TELEGRAM_CHAT_ID belum dibuat.' }

          $message = "<b>🖥 RDP WINDOWS (PLAYIT) AKTIF</b>`n`n" +
                     "<b>OS:</b> $env:OS_NAME`n" +
                     "<b>PC Name / Host:</b> <code>$env:FULL</code>`n" +
                     "<b>Username:</b> <code>$env:USERNAME</code>`n" +
                     "<b>Password:</b> <code>$env:PASSWORD</code>`n`n" +
                     "💡 <i>Langsung copas isi <b>PC Name</b> ke RD Client HP (tanpa VPN).</i>`n`n" +
                     "<b>🕹 Perintah Bot:</b>`n" +
                     "• <code>/status</code> - Cek status RDP`n" +
                     "• <code>/stop</code> - Matikan RDP"

          $body = @{
            chat_id = $env:CHAT_ID
            text = $message
            parse_mode = 'HTML'
          }

          $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body -TimeoutSec 30

      - name: Pertahankan RDP aktif & Bot Listener
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $offset = 0$startTime = Get-Date

          while ($true) {
            try {
              $updates = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/getUpdates?offset=$offset&timeout=5") -Method Get -TimeoutSec 10
              if ($updates.ok -and$updates.result.Count -gt 0) {
                foreach ($update in $updates.result) {$offset = $update.update_id + 1$chatId = "$($update.message.chat.id)"
                  $text = "$($update.message.text)".Trim()

                  if ($chatId -eq "$env:CHAT_ID") {
                    if ($text -eq "/status") {
                      $uptime = (Get-Date) -$startTime
                      $hours = [math]::Floor($uptime.TotalHours)
                      $mins =$uptime.Minutes
                      $reply = "🟢 <b>Status RDP:</b> Online (Playit.gg)`n⏰ <b>Uptime:</b> ${hours} jam ${mins} menit"
                      $body = @{ chat_id = $chatId; text = $reply; parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                    }
                    elseif ($text -eq "/start" -or $text -eq "/menu") {
                      $reply = "🤖 <b>Bot Berjalan!</b>`n`n" +
                               "<b>Daftar Command:</b>`n" +
                               "• <code>/start</code> atau <code>/menu</code> - Untuk melihat menu`n" +
                               "• <code>/status</code> - Untuk melihat status RDP`n" +
                               "• <code>/stop</code> atau <code>/off</code> - Untuk mematikan server"
                      $body = @{ chat_id = $chatId; text =$reply; parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                    }
                    elseif ($text -eq "/stop" -or $text -eq "/off") {
                      $reply = "🛑 <b>RDP Berhasil Dimatikan!</b>"
                      $body = @{ chat_id = $chatId; text =$reply; parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                      exit 0
                    }
                  }
                }
              }
            } catch {
              # Abaikan error sejenak
            }
            Start-Sleep -Seconds 3
          }
