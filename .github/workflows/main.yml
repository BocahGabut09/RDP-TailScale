name: RDP Telegram

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: "Pilih versi Windows"
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      username:
        description: "Username RDP"
        required: true
        default: RdpTpyo

permissions: {}

jobs:
  build-rdp:
    runs-on: ${{ inputs.os_choice || 'windows-2022' }}
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Aktifkan RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Buat user RDP
        shell: pwsh
        env:
          INPUT_USERNAME: ${{ inputs.username }}
        run: |
          $rdpUser = "$env:INPUT_USERNAME".Trim()
          if ([string]::IsNullOrWhiteSpace($rdpUser)) { $rdpUser = "RdpTpyo" }

          $rand = Get-Random -Minimum 100000 -Maximum 999999
          $password = "Pass123!" + "$rand"
          $securePassword = ConvertTo-SecureString -String("$password") -AsPlainText -Force

          if (Get-LocalUser -Name("$rdpUser") -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name("$rdpUser") -Force
          }

          New-LocalUser -Name("$rdpUser") -Password($securePassword) -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group("Remote Desktop Users") -Member("$rdpUser")
          Add-LocalGroupMember -Group("Administrators") -Member("$rdpUser")

          Write-Host("::add-mask::$password")

          Add-Content -Path($env:GITHUB_ENV) -Value("RDP_USERNAME=$rdpUser")
          Add-Content -Path($env:GITHUB_ENV) -Value("RDP_PASSWORD=$password")

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installer = Join-Path -Path($env:TEMP) -ChildPath('tailscale.msi')

          Invoke-WebRequest -Uri($url) -OutFile($installer)
          Start-Process -FilePath('msiexec.exe') -ArgumentList('/i', $installer, '/quiet', '/norestart') -Wait
          Remove-Item -Path($installer) -Force

      - name: Hubungkan Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Secret TAILSCALE_AUTH_KEY belum dibuat.'
          }

          $tailscale = Join-Path -Path($env:ProgramFiles) -ChildPath('Tailscale\tailscale.exe')
          & $tailscale up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="rdp-$env:GITHUB_RUN_ID"

          $ip = $null
          for ($i = 1; $i -le 12; $i++) {
            $ipRaw = & $tailscale ip -4
            if ($ipRaw) {
              $ip = "$ipRaw".Trim()
            }
            if ($ip -match '^\d{1,3}(\.\d{1,3}){3}$') {
              break
            }
            Start-Sleep -Seconds 5
          }

          if ($ip -notmatch '^\d{1,3}(\.\d{1,3}){3}$') {
            throw 'IP Tailscale tidak ditemukan.'
          }

          Write-Host("::add-mask::$ip")
          Add-Content -Path($env:GITHUB_ENV) -Value("TAILSCALE_IP=$ip")

      - name: Cek koneksi RDP
        shell: pwsh
        run: |
          $result = Test-NetConnection -ComputerName("$env:TAILSCALE_IP") -Port 3389 -WarningAction SilentlyContinue
          if (-not $result.TcpTestSucceeded) {
            throw 'Port RDP tidak dapat diakses.'
          }

      - name: Kirim akses ke Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IP: ${{ env.TAILSCALE_IP }}
          USERNAME: ${{ env.RDP_USERNAME }}
          PASSWORD: ${{ env.RDP_PASSWORD }}
          OS_NAME: ${{ inputs.os_choice || 'windows-2022' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) {
            throw 'Secret TELEGRAM_BOT_TOKEN belum dibuat.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CHAT_ID)) {
            throw 'Secret TELEGRAM_CHAT_ID belum dibuat.'
          }

          $message = "<b>🖥 RDP WINDOWS AKTIF</b>`n`n" +
                     "<b>OS:</b> $env:OS_NAME`n" +
                     "<b>IP:</b> <code>$env:IP</code>`n" +
                     "<b>Username:</b> <code>$env:USERNAME</code>`n" +
                     "<b>Password:</b> <code>$env:PASSWORD</code>`n" +
                     "<b>Port:</b> <code>3389</code>`n`n" +
                     "<b>🕹 Perintah Bot:</b>`n" +
                     "• <code>/status</code> - Cek status RDP`n" +
                     "• <code>/stop</code> - Matikan RDP"

          $body = @{
            chat_id = $env:CHAT_ID
            text = $message
            parse_mode = 'HTML'
          }

          $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body -TimeoutSec 30

      - name: Pertahankan RDP aktif & Bot Listener
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $offset = 0
          $startTime = Get-Date

          while ($true) {
            try {
              $updates = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/getUpdates?offset=$offset&timeout=5") -Method Get -TimeoutSec 10
              if ($updates.ok -and $updates.result.Count -gt 0) {
                foreach ($update in $updates.result) {
                  $offset = $update.update_id + 1
                  $chatId = "$($update.message.chat.id)"
                  $text = "$($update.message.text)".Trim()

                  if ($chatId -eq "$env:CHAT_ID") {
                    if ($text -eq "/status") {
                      $uptime = (Get-Date) - $startTime
                      $hours = [math]::Floor($uptime.TotalHours)
                      $mins = $uptime.Minutes
                      $reply = "🟢 <b>Status RDP:</b> Online`n⏰ <b>Uptime:</b> ${hours} jam${mins} menit"
                      $body = @{ chat_id = $chatId; text =$reply; parse_mode = 'HTML' }
                      $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                     }
                   if ($text -eq "/start") {
                     $reply = "<b>Command Menu:\n/status Melihat status\n/stop or /off mematikan Server"
                     $body = @{ chat_id = $chatId; text=$reply; pasre_mode = 'HTML' }
                     $null = Invoke-RestNethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                     }
                  elseif ($text -eq "/stop" -or $text -eq "/off") {
                     $reply = "🛑 <b>RDP Berhasil Dimatikan!</b>"
                     $body = @{ chat_id = $chatId; text =$reply; parse_mode = 'HTML' }
                     $null = Invoke-RestMethod -Uri("https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage") -Method Post -Body $body
                     exit 0
                    }
                  }
                }
              }
            } catch {
              # Abaikan error sejenak jika koneksi kedip
            }
            Start-Sleep -Seconds 3
          }
          
