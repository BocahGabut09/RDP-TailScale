name: RDP-TPYO

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: "Pilih Windows"
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      username:
        description: "Username RDP"
        required: true
        default: RDP

permissions: {}

jobs:
  build-rdp:
    runs-on: ${{ inputs.os_choice }}
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Aktifkan RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:SystemCurrentControlSetControlTerminal Server' `
            -Name fDenyTSConnections `
            -Value 0 `
            -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force

      - name: Buat user RDP
        shell: pwsh
        env:
          USERNAME: ${{ inputs.username }}
        run: |
          if ($env:USERNAME -notmatch '^[a-zA-Z0-9_-]{3,20}$') {
            throw "Username tidak valid."
          }

          $upper = [char[]](65..90) | Get-Random -Count 4
          $lower = [char[]](97..122) | Get-Random -Count 4
          $number = [char[]](48..57) | Get-Random -Count 4
          $special = [char[]](33..47) | Get-Random -Count 4

          $password = -join (($upper + $lower + $number + $special) | Sort-Object { Get-Random })
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser `
            -Name $env:USERNAME `
            -Password $secure `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:USERNAME

          "::add-mask::$password" >> $env:GITHUB_STEP_SUMMARY
          "RDP_USERNAME=$env:USERNAME" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Hubungkan Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFilesTailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="rdp-$env:GITHUB_RUN_ID"

          $ip = $null

          for ($i = 1; $i -le 12; $i++) {
            $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

            if ($ip -match '^d{1,3}(.d{1,3}){3}$') {
              break
            }

            Start-Sleep -Seconds 5
          }

          if ($ip -notmatch '^d{1,3}(.d{1,3}){3}$') {
            throw "IP Tailscale tidak ditemukan."
          }

          "::add-mask::$ip" >> $env:GITHUB_STEP_SUMMARY
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Kirim akses ke Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IP: ${{ env.TAILSCALE_IP }}
          USERNAME: ${{ env.RDP_USERNAME }}
          PASSWORD: ${{ env.RDP_PASSWORD }}
          OS: ${{ inputs.os_choice }}
        run: |
          "::add-mask::$env:BOT_TOKEN"
          "::add-mask::$env:PASSWORD"

          $message = @"
RDP AKTIF

OS: $env:OS
IP: $env:IP
Username: $env:USERNAME
Password: $env:PASSWORD
Port: 3389
"@

          Invoke-RestMethod `
            -Uri "https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage" `
            -Method Post `
            -Body @{
              chat_id = $env:CHAT_ID
              text = $message
            } | Out-Null

      - name: Pertahankan RDP
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 300
          }
